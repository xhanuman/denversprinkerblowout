        // =====================================================
        // INITIALIZATION
        // =====================================================
        document.addEventListener('DOMContentLoaded', function() {
            var form = document.getElementById('addressForm');
            if (form) {
                form.addEventListener('submit', onAddressSubmit);
            }

            // Seasonal auto-select: Jan-Aug = startup, Sep-Dec = blowout
            var month = new Date().getMonth(); // 0-11
            if (month >= 8) { // Sep-Dec
                var blowoutRadio = document.querySelector('input[value="blowout"]');
                if (blowoutRadio && !blowoutRadio.disabled) {
                    blowoutRadio.checked = true;
                } else {
                    // Blowout disabled, fall back to startup
                    document.querySelector('input[value="startup"]').checked = true;
                }
            } else { // Jan-Aug
                document.querySelector('input[value="startup"]').checked = true;
            }
        });

        // =====================================================
        // FORM SUBMISSION
        // =====================================================
        function onAddressSubmit(event) {
            if (event) {
                event.preventDefault();
            }

            var addressInput = document.getElementById('addressInput');
            if (!addressInput) {
                return;
            }

            var address = addressInput.value.trim();

            if (!isValidAddress(address)) {
                alert('Please enter a complete address, including street, city, and state.');
                return;
            }

            // Get selected service type
            var selectedService = document.querySelector('input[name="serviceType"]:checked');
            if (!selectedService) {
                alert('Please select a service type.');
                return;
            }
            var serviceType = selectedService.value;
            var zones = serviceZones[serviceType];

            if (!zones || zones.length === 0) {
                alert('This service is not yet available for scheduling. Please check back later.');
                return;
            }

            getCoordinates(address, function(location, error) {
                if (error) {
                    var errorMessageElem = document.getElementById('errorMessage');
                    if (errorMessageElem) {
                        errorMessageElem.textContent = error;
                    }
                    return;
                }

                // Check each zone's polygon
                for (var i = 0; i < zones.length; i++) {
                    if (isPointInPolygon(location, zones[i].polygon)) {
                        window.location.href = zones[i].url;
                        return;
                    }
                }

                alert('Address is either incomplete or out of our service area. Please review the syntax of your entry - ensure there is a comma after the address and enter the city at a minimum.');
            });
        }

        // =====================================================
        // UTILITY FUNCTIONS (unchanged)
        // =====================================================
        function isValidAddress(address) {
            var hasStreetNumber = /\d+/.test(address);
            var hasComma = /,/.test(address);
            return hasStreetNumber && hasComma;
        }

        function isPointInPolygon(point, polygon) {
            var x = point.lng;
            var y = point.lat;
            var inside = false;
            for (var i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                var xi = polygon[i][0], yi = polygon[i][1];
                var xj = polygon[j][0], yj = polygon[j][1];
                var intersect = ((yi > y) != (yj > y))
                    && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function getCoordinates(address, callback) {
            var apiKey = 'AIzaSyAVGo30Lp8CbkvGMSfDafAnlpvMpyBj4Lc';
            var url = 'https://maps.googleapis.com/maps/api/geocode/json?address=' + encodeURIComponent(address) + '&key=' + apiKey;

            fetch(url)
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.results.length > 0) {
                        var location = data.results[0].geometry.location;
                        callback(location, null);
                    } else {
                        callback(null, 'No results found');
                    }
                })
                .catch(function(error) { callback(null, error.message); });
        }
    </script>

        <label><input type="radio" name="serviceType" value="lawncare"> Lawn Care</label>

    <form id="addressForm" style="text-align: center; margin-top: 20px; font-family: 'Open Sans', 'Helvetica Neue', Arial, sans-serif;">
        <label for="addressInput" style="display: block;">Enter your address following this example:</label>
        (2300 Steele St, Denver 80205) w/o brackets and using a COMMA is necessary after the address!<br><br>
        <input type="text" id="addressInput" placeholder="Enter your address" style="text-align: left; width: 400px;">

        <button type="submit">Scheduling Link</button>
